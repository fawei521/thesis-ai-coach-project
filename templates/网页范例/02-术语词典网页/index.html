{"id":150,"cat":"paradigm","name":"练习效应与疲劳效应","en":"Practice & Fatigue Effect","def":"被试内设计（重复测量）中的主要额外变量。练习效应：被试因为重复做实验任务而越来越熟练，成绩越来越好（跟实验处理无关）。疲劳效应：被试因为重复做实验任务而越来越疲劳，成绩越来越差（跟实验处理无关）。两者都会混淆实验处理的真实效应，必须用抵消平衡法控制。312高频考点。","example":"被试内设计研究两种字体对阅读速度的影响，如果所有被试都先读字体A再读字体B，那么B的成绩可能因为练习效应而更快（被试读第二篇时更熟练了），也可能因为疲劳效应而更慢（被试读第二篇时累了）——不管哪种，都无法确定B的成绩差异是字体导致的还是顺序导致的。控制方法：①抵消平衡法——一半被试先A后B，另一半先B后A（ABBA设计或拉丁方设计），这样练习/疲劳效应对A和B的影响就平衡了；②如果练习/疲劳效应跟实验处理有交互作用（比如A的练习效应比B大），抵消平衡也无法完全控制，这时候应该考虑用被试间设计。其他顺序效应：①系列效应/位置效应（第一个和最后一个跟中间的不同）；②迁移效应（前一个处理的效果延续到后一个处理，如学习效应、残留效应）。如果迁移效应很强且不可逆，就不能用被试内设计。","related":["被试内设计","抵消平衡法","额外变量","额外变量控制方法","重复测量方差分析"]},
{"id":151,"cat":"paradigm","name":"抵消平衡法","en":"Counterbalancing","def":"通过平衡实验处理的呈现顺序来控制顺序效应（练习效应、疲劳效应）的方法。是被试内设计控制额外变量的主要方法。主要有：①ABBA设计——适用于自变量水平为2个时，被试按A-B-B-A的顺序接受处理；②拉丁方设计——适用于自变量水平≥3个时，每个处理在每个位置（顺序）上出现的次数相同，每个处理前面紧跟其他每个处理的次数也相同。312必考点。","example":"ABBA设计：2个处理A和B，每个被试按A→B→B→A的顺序做4次。A在第1和第4位，B在第2和第3位，练习/疲劳效应对A和B的影响平衡了。注意：ABBA设计假设练习/疲劳效应是线性的（均匀变化的），如果是非线性的（比如突然的练习效应），ABBA就不够了。拉丁方设计：3个处理A、B、C，3×3拉丁方：①A B C；②B C A；③C A B。每个处理在每个位置（第1、第2、第3）都出现一次，每个处理后面紧跟其他每个处理也各一次。被试人数应该是处理数的倍数（如3个处理用3个或6个被试，每个被试对应一行拉丁方）。抵消平衡法只能平衡跟处理无关的顺序效应，如果处理之间有差异延续效应（如A处理的效果会延续到B处理，且这种延续跟A-B顺序有关），抵消平衡就无法控制，这时候应该用被试间设计。","related":["被试内设计","练习效应与疲劳效应","额外变量控制方法","随机区组设计","重复测量方差分析"]},
{"id":152,"cat":"paradigm","name":"准实验设计","en":"Quasi-experimental Design","def":"不能完全随机分配被试的实验设计，通常利用自然形成的群体（如自然班级、医院病房）作为实验组和控制组。介于真实验设计和非实验设计之间，内部效度比真实验低，但比非实验高；外部效度通常比真实验高（因为在自然情境中进行）。312必考点。","example":"研究新教学法的效果，但学校的班级是固定的，不能随机把学生打散重新分班，就用一班做实验组（新教学法），二班做控制组（传统教学法）——这就是准实验设计。因为不是随机分配，两组可能本来就有差异（比如一班是重点班、二班是普通班），内部效度降低。常见准实验设计类型：①时间序列设计——对一组被试进行周期性的一系列前测，然后引入实验处理，再进行一系列后测，看处理前后的趋势变化；②相等时间样本设计——同一组被试，交替接受处理和不处理；③不相等对照组设计——有实验组和控制组，但不是随机分配的，两组都做前测和后测；④交叉滞后组相关设计——在两个时间点测量两个变量，看交叉滞后相关，推断因果方向。准实验设计的优点：①外部效度高（自然情境）；②伦理上更可行（有些情况不能随机分配）；③适合研究长期效应。缺点：①内部效度低（选择偏差、历史效应等）；②统计分析更复杂。","related":["实验研究","完全随机设计","时间序列设计","内部效度","外部效度","额外变量"]},
{"id":153,"cat":"paradigm","name":"时间序列设计","en":"Time Series Design","def":"准实验设计的一种，对一组被试（或一个被试）进行周期性的一系列前测，然后引入实验处理（干预），再进行一系列后测，通过比较处理前后的测量趋势来评估干预效果。核心是看处理前后的数据趋势是否有突变。312考点。","example":"研究某心理干预对学生焦虑的影响，在干预前连续测量4次焦虑（每周一次），然后进行4周干预，干预后再连续测量4次焦虑。如果干预前焦虑一直稳定在高位（趋势线平），干预后焦虑持续下降（趋势线明显向下倾斜），且变化点正好在干预引入的时间点，就说明干预可能有效。时间序列设计的优点：①多次前测和后测能看到变化趋势，比只有一次前测后测更有说服力；②能控制成熟、测验等额外变量（因为有多次测量的趋势做参照）；③适合评估干预效果（如政策实施、治疗方案）。缺点：①没有控制组，历史效应（干预期间发生的其他事件）可能混淆结果；②多次测量可能导致练习效应或反应性；③数据统计分析较复杂（需要用中断时间序列分析ITSA）。改进型：不相等控制组时间序列设计——加一个不接受处理的控制组，也做多次前测后测，这样能控制历史效应，内部效度更高。","related":["准实验设计","实验研究","内部效度","外部效度","重复测量方差分析"]},
{"id":154,"cat":"paradigm","name":"反应时","en":"Reaction Time","def":"从刺激呈现到被试作出反应之间的时间间隔，又称反应潜伏期。包括：刺激引起感官兴奋→神经冲动传递→大脑加工（核心部分）→神经冲动传出到效应器→效应器反应。反应时是实验心理学中最常用的因变量之一，被称为心理学的第三维度。312必考点。","example":"屏幕上出现一个光点，被试要尽快按空格键——从光点出现到按下键的时间就是反应时，通常在200-300毫秒。反应时的研究历史：①唐德斯（Donders）1868年提出减数法，开创了反应时研究；②冯特在莱比锡实验室把反应时作为重要研究课题；③斯滕伯格（Sternberg）1969年提出加因素法，发展了反应时研究方法。反应时的种类：①简单反应时（A反应时）——单一刺激单一反应；②选择反应时（B反应时）——多个刺激对应多个反应；③辨别反应时（C反应时）——多个刺激但只对其中一个反应。反应时的影响因素：①刺激因素（刺激强度、刺激类型、刺激复杂度）；②机体因素（适应水平、准备状态、练习次数、动机、年龄、个体差异、酒精药物）；③环境因素（温度、噪音）。速度-准确性权衡是反应时研究中必须注意的问题——反应越快，错误率可能越高，需要平衡。","related":["唐德斯减数法","斯滕伯格加因素法","速度-准确性权衡","开窗实验","因变量"]},
{"id":155,"cat":"paradigm","name":"唐德斯减数法","en":"Donders Subtractive Method","def":"唐德斯1868年提出的反应时分析方法，核心逻辑：如果一个复杂任务包含一个简单任务的所有加工阶段，再加上额外的加工阶段，那么两者的反应时之差就是额外加工阶段所需的时间。即通过相减来分离出某个特定认知加工阶段的时间。是认知心理学的经典方法，312必考点。","example":"唐德斯设计了三种反应时：①A反应时（简单反应时）——一个刺激，一个反应（如看到光就按键），包含感觉登记→刺激识别→反应选择→反应执行。实际上A反应时=基线时间（感觉+运动）；②B反应时（选择反应时）——多个刺激，每个刺激对应不同反应（如看到红光按左键、蓝光按右键），包含感觉登记→刺激识别→反应选择（选择哪个反应）→反应执行。B反应时比A反应时多了反应选择阶段，所以反应选择时间=B-A；③C反应时（辨别反应时）——多个刺激，但只对其中一个反应（如看到红光按键，蓝光不反应），包含感觉登记→刺激识别（辨别是不是目标刺激）→反应执行。C反应时比A反应时多了刺激辨别阶段，所以辨别时间=C-A。那么：辨别时间=C-A；选择时间=B-C（因为B比C多了反应选择阶段）。减数法的应用：①心理旋转实验（Shepard）——旋转角度越大反应时越长，证明心理旋转是真实的认知过程；②短时记忆信息提取实验（斯滕伯格）——后来发展为加因素法；③句子-图画匹配实验。减数法的前提假设：认知加工过程是系列加工的（一个接一个），且插入一个加工阶段不影响其他阶段的时间（纯插入假设）。","related":["反应时","斯滕伯格加因素法","开窗实验","速度-准确性权衡"]},
{"id":156,"cat":"paradigm","name":"斯滕伯格加因素法","en":"Sternberg Additive Factors Method","def":"斯滕伯格1969年在减数法基础上发展的反应时分析方法，核心逻辑：如果两个因素的效应是相互制约的（一个因素的效应受另一个因素水平的影响，即有交互作用），那么它们作用于同一个加工阶段；如果两个因素的效应是独立的（分别影响不同的阶段，效应可以相加），那么它们作用于不同的加工阶段。通过系统操纵多个因素，分析它们的交互作用，从而揭示信息加工的各个阶段。312考点。","example":"斯滕伯格的短时记忆信息提取实验：给被试呈现1-6个数字（识记项目），然后呈现一个探测数字，让被试判断探测数字是否在识记项目中，记录反应时。操纵两个因素：①识记项目的数量（1-6个）；②探测项目的质量（清晰vs模糊，即刺激降解）。发现：①识记项目数量和探测项目质量的效应是独立的（可以相加，无交互作用）→说明它们作用于不同的加工阶段；②识记项目数量影响比较阶段（项目越多，比较次数越多，反应时越长）；③探测项目质量影响刺激编码阶段（模糊刺激编码更慢）。加因素法的逻辑跟减数法不同：减数法是通过相减分离出某个阶段的时间，加因素法是通过因素间的交互作用判断哪些因素属于同一个阶段。加因素法的前提假设：信息加工是系列加工的（阶段式），且不同阶段的加工时间可以相加。加因素法的贡献：它不需要事先知道每个阶段的具体时间，只需要通过操纵因素、分析交互作用就能推断加工阶段的数量和顺序，比减数法更灵活。","related":["反应时","唐德斯减数法","开窗实验","交互作用"]},
{"id":157,"cat":"paradigm","name":"速度-准确性权衡","en":"Speed-Accuracy Trade-off","def":"反应时研究中的一个基本现象：被试在反应速度和反应准确性之间存在权衡——如果要求反应越快，错误率就会越高；如果要求准确性越高，反应时就会越长。因此在反应时实验中，不能只看反应时，必须同时看错误率，否则结论可能被误导。312高频考点。","example":"研究两种任务的难度，如果只看反应时，发现任务A的反应时比任务B短，可能得出任务A更简单的结论。但如果同时看错误率，发现任务A的错误率是30%，任务B的错误率是5%——这说明被试在任务A中抢速度（快速反应但经常错），在任务B中求准确（慢但准确）。任务A反应时短可能不是因为简单，而是因为被试降低了准确性标准。正确的做法：①在实验指导语中明确要求被试既快又准，平衡速度和准确性；②分析数据时同时报告反应时和错误率；③如果两组的错误率差异很大，需要用速度-准确性操作特征曲线（SAOC）来更准确地比较；④可以用信号检测论的方法，把辨别力（d-prime）和反应标准（β）分开，避免速度-准确性权衡的混淆。速度-准确性权衡是反应时实验中最常见的混淆变量之一，也是考研选择题的高频考点。","related":["反应时","唐德斯减数法","信号检测论","辨别力指数"]},
{"id":158,"cat":"paradigm","name":"绝对阈限","en":"Absolute Threshold","def":"刚刚能引起感觉的最小刺激强度。操作性定义：有50%的实验次数能引起感觉、50%的次数不能引起感觉的那个刺激强度。是心理物理学的核心概念之一。注意：绝对阈限不是一个固定不变的值，而是一个统计量——因为感觉是连续变化的，不存在一个突然从无到有的精确点。312必考点。","example":"测量听觉绝对阈限：给被试呈现不同强度的声音，从完全听不到的强度开始，逐渐增加强度，记录被试刚刚听到的强度；再从能听到的强度开始，逐渐降低，记录刚刚听不到的强度。重复多次，取所有转折点的平均数，就是绝对阈限。比如10次测量的转折点分别是8、9、8、10、9、8、9、10、9、8分贝，平均=8.8分贝，这就是听觉绝对阈限（操作性定义：50%次数能听到的强度）。绝对阈限的意义：①它定义了感觉系统的感受性范围——低于绝对阈限的刺激我们感觉不到（但可能有阈下知觉）；②不同感觉通道的绝对阈限差异很大（如视觉的绝对阈限非常低，在晴朗黑夜能看到48公里外的烛光；听觉的绝对阈限是安静环境中6米外的手表滴答声）；③绝对阈限可以因适应、疲劳、注意、动机等因素而变化。","related":["差别阈限","极限法","平均差误法","恒定刺激法","心理物理学方法"]},
{"id":159,"cat":"paradigm","name":"差别阈限","en":"Difference Threshold (JND)","def":"刚刚能觉察出两个刺激有差异的最小差别量，又称最小可觉差（just noticeable difference, JND）。操作性定义：有50%的实验次数能觉察出差别、50%的次数不能觉察出差别的刺激差别量。差别阈限越小，说明感受性越高（越能分辨细微差别）。312必考点。","example":"测量重量差别阈限：标准刺激是100克，比较刺激是95-105克，让被试判断比较刺激比标准刺激重、轻还是相等。结果：102克时有50%的次数被判断为比100克重，98克时有50%的次数被判断为比100克轻。那么：上差别阈限（DLu）=102-100=2克；下差别阈限（DLl）=100-98=2克；差别阈限（DL）=(DLu+DLl)/2=2克。意思是：重量变化小于2克时，人们通常觉察不到差异；变化2克或以上时，才能刚刚觉察到。差别阈限跟标准刺激的大小有关——标准刺激越大，差别阈限也越大（韦伯定律）。比如100克的差别阈限是2克，200克的差别阈限可能是4克，400克的差别阈限可能是8克——但差别阈限跟标准刺激的比值（2/100=4/200=8/400=0.02）是恒定的，这就是韦伯定律。","related":["绝对阈限","韦伯定律","极限法","平均差误法","恒定刺激法","心理物理学方法"]},
{"id":160,"cat":"paradigm","name":"极限法","en":"Method of Limits","def":"又称最小变化法、序列探索法、最小可觉差法，是测量阈限的直接方法。特点：将刺激按递增或递减序列的方式，以间隔相等的小步变化，寻求从一种反应到另一种反应的瞬时转换点（阈限位置）。是测量感觉阈限的三种基本方法之一，312必考点。","example":"测量绝对阈限（如听觉）：①递增序列：从完全听不到的强度开始，每次增加一小步（如1分贝），直到被试报告听到了，记录这个转折点；②递减序列：从明显能听到的强度开始，每次减少一小步，直到被试报告听不到了，记录转折点；③递增和递减序列交替进行，各做若干次（如各4次，共8次）；④取所有转折点的平均数作为绝对阈限。测量差别阈限：标准刺激固定（如100克），比较刺激从明显比标准重开始递减，或从明显比标准轻开始递增，记录被试反应从重变相等、从相等变轻的转折点（递减序列），以及从轻变相等、从相等变重的转折点（递增序列）。极限法的误差：①期望误差——被试在递增序列中过早期望转折点到来（提前报告听到了），在递减序列中过早期望听不到，导致阈限偏低；②习惯误差——被试习惯于前面的反应，该转变时不转变，导致阈限偏高；③练习误差和疲劳误差。控制方法：递增和递减序列数量相等且交替排列，平衡期望/习惯误差；ABBA顺序平衡练习/疲劳误差。","related":["绝对阈限","差别阈限","平均差误法","恒定刺激法","心理物理学方法"]},
{"id":161,"cat":"paradigm","name":"平均差误法","en":"Method of Average Error","def":"又称调整法、再造法、均等法，测量阈限的方法。特点：被试自己调整比较刺激，使之与标准刺激相等（测量差别阈限），或调整刺激使之刚刚能感觉到（测量绝对阈限）。被试反复调整多次，每次调整的结果与标准刺激（或绝对阈限）的差的平均数就是差别阈限（或绝对阈限）。312考点。","example":"测量长度差别阈限：给被试呈现一个标准线段（如10cm），旁边有一个可以调整长度的比较线段，让被试调整比较线段使之看起来跟标准线段一样长。重复20次，每次记录被试调整后的长度。20次调整的平均数可能是10.2cm（跟标准10cm有偏差），每次调整结果跟标准的差的绝对值的平均数=平均差误=差别阈限的估计值。平均差误法的特点：①被试主动操作，积极性高，不容易疲劳；②测量的是相等判断的变异性，跟极限法和恒定刺激法测量刚刚能觉察差别略有不同；③平均差误法测得的阈限跟其他方法可能不完全一致（因为方法不同），但在同一方法内可以比较不同条件的感受性。误差：①动作误差——被试调整时的动作习惯（如总是从短往长调 vs 从长往短调）导致系统偏差；②空间误差——标准刺激和比较刺激的空间位置（左右）导致偏差。控制方法：①标准刺激和比较刺激的位置左右交替（控制空间误差）；②比较刺激的初始位置有时比标准长、有时比标准短（控制动作误差）。","related":["绝对阈限","差别阈限","极限法","恒定刺激法","心理物理学方法"]},
{"id":162,"cat":"paradigm","name":"恒定刺激法","en":"Method of Constant Stimuli","def":"又称正误法、次数法，测量阈限最准确、应用最广的方法。特点：在实验前选定5-7个固定的刺激强度（在阈限附近），每个刺激随机呈现多次（通常50-200次），记录被试在每个刺激强度下报告有感觉（或有差别）的次数，然后用统计方法（直线内插法、平均Z分数法、最小二乘法）计算阈限。312必考点，三种方法中最重要。","example":"测量绝对阈限（如重量）：①预实验确定阈限大致范围（如8-12克之间）；②选5个恒定刺激：8、9、10、11、12克；③每个刺激随机呈现100次，共500次，记录每次被试是否感觉到重量；④统计每个刺激被报告有感觉的百分比：8克=10%，9克=30%，10克=55%，11克=75%，12克=95%；⑤用直线内插法计算50%对应的刺激强度：在9克（30%）和10克（55%）之间内插，50%对应的刺激=9+(10-9)×(50-30)/(55-30)=9+1×20/25=9.8克。9.8克就是绝对阈限。测量差别阈限：标准刺激固定（如100克），选5-7个比较刺激（如96、98、100、102、104克），每个比较刺激跟标准刺激配对呈现，让被试判断重、相等、轻，统计每个比较刺激被判断为重的百分比和轻的百分比，分别内插出50%被判断为重的刺激（上阈限）和50%被判断为轻的刺激（下阈限），差别阈限=(上阈限-下阈限)/2。恒定刺激法的优点：①刺激恒定，记录准确，结果可靠；②适用范围广（可测绝对阈限、差别阈限、等值等）；③被试不知道接下来是什么刺激，减少期望误差。缺点：①需要较多的实验次数（费时）；②如果刺激范围选得不好（离阈限太远），结果不准确。","related":["绝对阈限","差别阈限","极限法","平均差误法","心理物理学方法"]},
{"id":163,"cat":"paradigm","name":"韦伯定律","en":"Weber Law","def":"德国生理学家韦伯1834年提出，差别阈限跟标准刺激强度的比值是一个常数，公式K=ΔI/I，其中ΔI是差别阈限（JND），I是标准刺激强度，K是韦伯分数（常数）。意思是：标准刺激越大，差别阈限也越大，但两者的比值不变。是心理物理学第一个定量定律，312必考点。","example":"重量的韦伯分数K≈0.02（1/50）：标准刺激100克时，差别阈限=100×0.02=2克（需要变化2克才能刚刚觉察到）；标准刺激200克时，差别阈限=200×0.02=4克；标准刺激400克时，差别阈限=400×0.02=8克。虽然差别阈限随标准刺激增大而增大，但比值ΔI/I始终=0.02。不同感觉通道的韦伯分数不同：①重量K≈0.02（最敏感）；②响度K≈0.1；③亮度K≈0.016；④皮肤压力K≈0.14；⑤咸味K≈0.2。韦伯分数越小，说明该感觉通道的差别感受性越高（越能分辨细微差别）。韦伯定律的适用范围：只适用于中等强度的刺激——刺激太弱（接近绝对阈限）或太强时，韦伯分数会变大，定律不成立。韦伯定律的意义：①它是第一个关于心理量和物理量关系的定量定律，开创了心理物理学；②它说明感觉不是刺激的简单反映，而是跟刺激的相对变化有关；③费希纳在韦伯定律基础上发展了费希纳定律（对数定律）。","related":["差别阈限","费希纳定律","史蒂文斯幂定律","绝对阈限","心理物理学方法"]},
{"id":164,"cat":"paradigm","name":"费希纳定律","en":"Fechner Law","def":"德国物理学家、心理物理学创始人费希纳1860年在韦伯定律基础上提出，感觉强度与刺激强度的对数成正比，公式S=K·lgI，其中S是感觉量（心理量），I是刺激强度（物理量），K是常数。意思是：刺激强度按几何级数增加时，感觉强度只按算术级数增加——感觉增长比刺激增长慢。是心理物理学的经典定律，312必考点。","example":"假设K=1，刺激强度I=10时，感觉量S=lg10=1；I=100时，S=lg100=2；I=1000时，S=lg1000=3。刺激从10增加到100（增加了90，10倍），感觉只从1增加到2（增加了1，1倍）；刺激从100增加到1000（增加了900，10倍），感觉只从2增加到3（又增加了1）。这就是对数关系——刺激成倍增加，感觉等量增加。费希纳定律的推导前提：①韦伯定律成立（差别阈限ΔI=KI）；②每个最小可觉差（JND）在主观上是相等的（即不管标准刺激多大，一个JND引起的感觉变化量都相同）。那么感觉量S就是JND的数量累加，S=K·lgI+C。费希纳定律的意义：①它把心理量和物理量的关系用数学公式表达出来，是心理物理学的基石；②它说明感觉是刺激的对数函数，解释了为什么我们对微弱刺激的变化更敏感、对强刺激的变化不敏感（如在暗室里一根蜡烛很明显，在阳光下一根蜡烛几乎感觉不到）。局限：①只适用于中等强度刺激；②每个JND主观相等的假设受到质疑（史蒂文斯用数量估计法发现心理量跟物理量是幂函数关系，不是对数关系）。","related":["韦伯定律","史蒂文斯幂定律","差别阈限","心理物理学方法"]},
{"id":165,"cat":"paradigm","name":"史蒂文斯幂定律","en":"Stevens Power Law","def":"美国心理学家史蒂文斯1957年提出，用数量估计法研究发现，感觉强度与刺激强度的幂函数成正比，公式S=K·Iⁿ，其中S是感觉量，I是刺激强度，K是常数，n是幂指数。不同感觉通道的n不同：n>1时感觉增长比刺激快（如电击、肌肉用力）；n<1时感觉增长比刺激慢（如亮度、响度、重量，跟费希纳定律一致）；n=1时感觉跟刺激成正比（如线段长度估计）。312必考点，常考跟费希纳定律的比较。","example":"①亮度感觉n≈0.33（<1，感觉增长慢）：亮度增加10倍，感觉只增加10^0.33≈2.15倍；②电击感觉n≈3.5（>1，感觉增长快）：电击强度增加2倍，感觉增加2^3.5≈11.3倍——这解释了为什么电击稍微增强就会感到剧烈疼痛；③线段长度估计n≈1.0（=1，成正比）：线段长2倍，感觉也长2倍。史蒂文斯幂定律跟费希纳定律的区别：①费希纳定律是对数函数S=KlgI，史蒂文斯是幂函数S=KIⁿ；②费希纳定律假设所有JND主观相等，史蒂文斯用数量估计法直接让被试给感觉量赋值（不依赖JND假设）；③费希纳定律只适用于中等强度，史蒂文斯幂定律适用范围更广；④史蒂文斯幂定律能解释不同感觉通道的不同增长模式（n不同），费希纳定律只能解释感觉增长慢的情况。幂定律的意义：它是目前最被广泛接受的心理物理函数，说明心理量和物理量的关系不是单一的对数关系，而是因感觉通道而异的幂函数关系。","related":["费希纳定律","韦伯定律","差别阈限","心理物理学方法"]},
{"id":166,"cat":"paradigm","name":"信号检测论","en":"Signal Detection Theory (SDT)","def":"1954年坦纳和斯威茨在统计决策理论基础上提出，用于研究个体在不确定情况下如何做出决策。核心观点：个体对刺激的判断（有信号还是无信号）不仅取决于感受性（辨别力），还取决于反应标准（决策偏向）。信号检测论能把感受性和反应标准分离开来，这是它跟传统心理物理学（阈限理论）最大的区别。312必考点，实验心理学综合题高频考点。","example":"在噪音背景下检测微弱信号（如雷达检测敌机、医生看X光片诊断肿瘤）：每次试验要么是信号+噪音（SN，有机票），要么是噪音 alone（N，没有机票）。被试判断有信号或无信号，结果有四种：①击中（hit）——有信号，正确报告有；②漏报（miss）——有信号，错误报告无；③虚报（false alarm）——无信号，错误报告有；④正确拒绝（correct rejection）——无信号，正确报告无。传统阈限理论把有50%报告有信号的刺激强度作为阈限，但这个阈限混淆了感受性和反应标准——一个被试可能因为很谨慎（高标准）而很少报告有（击中率低、虚报率也低），另一个被试可能因为很冒险（低标准）而经常报告有（击中率高、虚报率也高），两人的阈限不同，但感受性可能完全一样！信号检测论用辨别力指数d-prime衡量感受性（d-prime越大，感受性越高），用判断标准β（或c）衡量反应偏向，把两者分开。这是信号检测论的最大贡献。应用：①医学诊断（医生的辨别力和判断标准）；②司法目击证人辨认；③警戒任务（雷达检测、工业质检）；④记忆研究（记得/知道判断）；⑤心理咨询评估。","related":["绝对阈限","差别阈限","击中率与虚报率","辨别力指数","ROC曲线"]},
{"id":167,"cat":"paradigm","name":"辨别力指数","en":"Sensitivity Index (d-prime)","def":"信号检测论中衡量个体感受性（辨别信号和噪音的能力）的指标，公式d-prime=Z击中-Z虚报，即击中率对应的Z分数减去虚报率对应的Z分数。d-prime越大，说明被试越能区分信号和噪音（感受性越高）；d-prime=0说明完全不能区分（跟瞎猜一样）；d-prime>0说明有辨别力。312必考点，常考计算。","example":"某被试在信号检测实验中，击中率P(hit)=0.84，虚报率P(fa)=0.16。查标准正态分布表：Z(0.84)=+1.0，Z(0.16)=-1.0。d-prime=Z击中-Z虚报=1.0-(-1.0)=2.0。d-prime=2.0说明感受性较高（能较好地区分信号和噪音）。另一个被试击中率=0.50，虚报率=0.50，Z(0.50)=0，d-prime=0-0=0，说明完全不能区分信号和噪音（跟瞎猜一样）。d-prime的特点：①d-prime不受反应标准影响——不管被试是谨慎还是冒险，只要感受性不变，d-prime就不变（这是信号检测论的核心优势）；②d-prime的大小取决于信号和噪音两个分布的距离——信号分布和噪音分布离得越远，d-prime越大；③d-prime的计算需要知道击中率和虚报率，通过查Z表（标准正态分布表）得到Z分数。判断标准β（似然比）=O击中/O虚报（O是正态曲线的纵线高度/概率密度），β>1说明标准严格（谨慎，不轻易报告有信号），β<1说明标准宽松（冒险）。ROC曲线就是在不同判断标准下，击中率和虚报率的关系曲线，曲线下面积反映d-prime的大小。","related":["信号检测论","击中率与虚报率","ROC曲线"]},
{"id":168,"cat":"paradigm","name":"ROC曲线","en":"Receiver Operating Characteristic Curve","def":"接收者操作特性曲线，又称感受性曲线、等感受性曲线。在信号检测论中，通过改变判断标准（如改变奖惩办法、信号先定概率），得到一系列不同标准下的击中率和虚报率，以虚报率为横坐标、击中率为纵坐标作图，得到的曲线就是ROC曲线。同一条ROC曲线上的点d-prime相同（感受性相同，只是反应标准不同），所以叫等感受性曲线。312必考点。","example":"ROC曲线的特点：①曲线从左下角(0,0)到右上角(1,1)，对角线（从(0,0)到(1,1)的直线）代表d-prime=0（完全不能区分，跟瞎猜一样）；②曲线离对角线越远（越靠近左上角），说明d-prime越大（感受性越高）；③同一条曲线上的所有点d-prime相同（感受性相同），只是判断标准不同——左下角的点标准严格（击中率低、虚报率也低），右上角的点标准宽松（击中率高、虚报率也高）；④ROC曲线的曲率（曲线下面积AUC）直接反映d-prime的大小——AUC=0.5对应d-prime=0，AUC越接近1，d-prime越大。ROC曲线的意义：①它直观地展示了感受性（d-prime）和反应标准（β）的分离——同一条曲线上移动是改变标准，曲线整体移动是改变感受性；②它是评估检测系统性能的标准工具（医学诊断、雷达检测、人脸识别、信用评分等都用ROC曲线和AUC值评估性能）；③在心理学中，ROC曲线用于记忆研究（回忆/再认的感受性）、知觉研究、警戒任务等。注意：ROC曲线最初是二战中为评估雷达操作员的检测性能而发展的（Receiver Operating Characteristic就是接收者操作特征的意思），后来引入心理学。","related":["信号检测论","击中率与虚报率","辨别力指数"]},
{"id":169,"cat":"paradigm","name":"开窗实验","en":"Open Window Experiment","def":"反应时研究的一种方法，由汉密尔顿（Hamilton）等人提出，核心思想是直接测量每个认知加工阶段的时间，而不是通过相减间接推断。被试在完成任务的过程中，每完成一个加工阶段就按一次键，从而直接得到每个阶段的耗时。跟减数法和加因素法并列，是反应时研究的三大方法之一。","example":"经典的字母转换实验：给被试呈现\"3+E\"，被试需要先看到\"3\"（表示要转换3个字母），然后看到\"E\"，在心里把E往后数3个字母得到H，然后出声报告结果。开窗实验让被试在每个阶段按键：①看到刺激时按键（编码阶段结束）；②完成转换时按键（转换阶段结束）；③报告完成时按键（反应组织阶段结束）。这样直接得到每个阶段的时间，而不需要用B-A或C-A来间接推断。开窗实验的优点是直观、直接；缺点是按键本身可能干扰认知加工，且不是所有任务都能清晰地分成可按键的阶段。","related":["反应时","唐德斯减数法","斯滕伯格加因素法","速度-准确性权衡"]},
{"id":170,"cat":"construct","name":"冲动性","en":"Impulsivity","def":"一种人格特质，指个体倾向于在没有充分思考、不考虑后果的情况下快速做出反应，缺乏对冲动的抑制能力。包含多个维度：①运动冲动（行为上不加思考就行动）；②认知冲动（决策时不深思熟虑）；③无计划冲动（缺乏远见和计划）。是很多心理问题和行为问题的核心风险因素。","example":"冲动性与非自杀性自伤（NSSI）显著正相关（r=0.35）——高冲动性的人在情绪痛苦时更可能不假思索地伤害自己。冲动性在反刍思维与NSSI之间起中介作用：反刍→情绪调节困难→冲动性升高→NSSI。常用量表：Barratt冲动性量表（BIS-11，30题，3个维度）、UPPS-P冲动行为量表（5个维度：负性紧迫感、正性紧迫感、缺乏预谋、缺乏坚持、感觉寻求）。Go/No-Go范式和Stop-Signal任务是测量冲动性（反应抑制）的经典行为范式。高冲动性跟物质滥用、赌博、攻击行为、危险驾驶、暴饮暴食都相关。","related":["自我控制","反刍思维","Go/No-Go范式","非自杀性自伤"]},
{"id":171,"cat":"construct","name":"注意偏向","en":"Attentional Bias","def":"个体对特定类型的刺激（如威胁性刺激、消极信息、成瘾相关线索）优先分配注意资源的倾向。表现为：①注意定向加速（更快地注意到特定刺激）；②注意解除困难（注意力一旦被特定刺激捕获就难以移开）。是认知理论解释情绪障碍维持和成瘾行为的核心机制。","example":"抑郁者对悲伤面孔有注意偏向——在点探测范式中，当探测点出现在悲伤面孔位置时反应时显著快于中性面孔位置，说明抑郁者的注意力被悲伤信息优先捕获。焦虑者对威胁性刺激（如愤怒面孔、威胁词）有注意偏向。成瘾者对成瘾相关线索（如酒瓶、注射器）有注意偏向。注意偏向的测量范式：点探测范式（最常用）、情绪Stroop范式、视觉搜索范式、眼动追踪（直接看注视轨迹）。注意偏向训练（ABM）就是基于注意偏向理论发展的干预方法——通过反复训练让被试注意积极刺激而非消极刺激，来减轻抑郁和焦虑症状。","related":["点探测范式","Stroop范式","眼动追踪","反刍思维"]},
{"id":172,"cat":"paradigm","name":"完全随机设计","en":"Completely Randomized Design","def":"被试间设计的基本形式，将被试完全随机地分配到各个实验处理组中，每个被试只接受一个处理水平。随机分配是核心——它能平衡各组在所有已知和未知额外变量上的差异，是内部效度的重要保障。也叫独立组设计、简单随机分组设计。312实验心理学必考点。","example":"研究\"三种教学方法对成绩的影响\"：从150名学生中完全随机抽取50人分到A法组、50人到B法组、50人到C法组，一学期后比较三组成绩。因为是完全随机分配，三组在智力、动机、初始成绩等所有变量上理论上是平衡的，所以成绩差异可以归因于教学方法。统计方法：单因素完全随机方差分析（one-way ANOVA），F=MS组间/MS组内，自由度组间=k-1（k是组数），组内=N-k。如果只有两组，等价于独立样本t检验（F=t²）。完全随机设计的优点：①简单易行；②每个被试只做一次，没有顺序效应；③统计分析简单。缺点：①需要大量被试；②个体差异成为误差变异的一部分，检验力不如随机区组设计。","related":["被试间设计","随机区组设计","方差分析","独立样本t检验","额外变量控制方法"]},
{"id":173,"cat":"paradigm","name":"随机区组设计","en":"Randomized Block Design","def":"被试内设计的一种形式，先将被试按某个额外变量（如智力、年龄、初始成绩）分成若干个区组（block），每个区组内的被试在该额外变量上同质，然后每个区组内的被试随机接受所有实验处理（即每个被试做所有条件）。目的是控制该额外变量，减少误差变异，提高检验力。312实验心理学必考点。","example":"研究\"三种字体对阅读速度的影响\"，担心智力会影响阅读速度，就先按智力测验分数把30名被试分成10个区组（每个区组3人，智力水平相近），然后每个区组内的3名被试分别随机接受三种字体条件——实际上每个被试都要读三种字体的文章（被试内），区组是为了分析时控制智力的效应。统计方法：随机区组方差分析，总变异分解为：处理效应（字体）+区组效应（智力）+误差。F处理=MS处理/MS误差。因为区组效应从误差中分离出来了，MS误差比完全随机设计小，F值更大，检验力更高。随机区组设计的关键：①区组变量必须跟因变量相关（否则分离出来没意义）；②每个区组内的被试数=处理水平数；③处理在区组内的呈现顺序要抵消平衡。","related":["被试内设计","完全随机设计","方差分析","配对样本t检验","抵消平衡法"]},
{"id":174,"cat":"paradigm","name":"击中率与虚报率","en":"Hit Rate & False Alarm Rate","def":"信号检测论中的两个核心概率。击中率（hit rate, H）：在有信号的试次中，被试正确报告\"有信号\"的比例，H=击中数/(击中数+漏报数)。虚报率（false alarm rate, FA）：在无信号（只有噪音）的试次中，被试错误报告\"有信号\"的比例，FA=虚报数/(虚报数+正确拒绝数)。两者结合才能计算辨别力d-prime和判断标准β。312必考点。","example":"100次信号试次中，被试80次报告\"有信号\"（击中），20次报告\"无信号\"（漏报），击中率H=80/100=0.80。100次噪音试次中，被试20次报告\"有信号\"（虚报），80次报告\"无信号\"（正确拒绝），虚报率FA=20/100=0.20。查标准正态分布表：Z(H)=Z(0.80)=+0.84，Z(FA)=Z(0.20)=-0.84。辨别力d-prime=Z(H)-Z(FA)=0.84-(-0.84)=1.68。判断标准β=O(H)/O(FA)，O是正态曲线的纵线高度（概率密度），O(0.80)=0.280，O(-0.84)=0.280，β=0.280/0.280=1.0（中性标准）。四种结果的关系：击中率+漏报率=1，虚报率+正确拒绝率=1。被试越冒险（低标准），击中率和虚报率都高；被试越谨慎（高标准），两者都低——这就是为什么不能只看击中率，必须同时看虚报率。","related":["信号检测论","辨别力指数","ROC曲线","绝对阈限"]},
{"id":175,"cat":"paradigm","name":"心理物理学方法","en":"Psychophysical Methods","def":"研究物理刺激强度与心理感觉之间关系的方法，是实验心理学最古老、最基础的研究领域。核心任务是测量感觉阈限（绝对阈限和差别阈限）和建立心理物理函数（感觉量与刺激量的关系）。三大经典方法：极限法（最小变化法）、平均差误法（调整法）、恒定刺激法（正误法）。现代方法：信号检测论（把感受性和反应标准分开）。312实验心理学核心章节。","example":"心理物理学的研究逻辑：物理刺激（如声音的分贝数、光的亮度、重量的克数）是客观可测的，但人的感觉（\"听到了吗？\"\"两个声音一样响吗？\"）是主观的。心理物理学就是要建立这两者之间的数学关系。三大经典方法比较：①极限法——刺激按递增/递减序列小步变化，直接找转折点，适合测阈限，但有期望误差和习惯误差；②平均差误法——被试自己调整比较刺激，主动性高，适合测差别阈限和等值，但有动作误差和空间误差；③恒定刺激法——刺激固定、随机呈现多次，结果最准确可靠，应用最广，但费时。三大定律：韦伯定律（差别阈限与标准刺激成正比）、费希纳定律（感觉量是刺激量的对数函数）、史蒂文斯幂定律（感觉量是刺激量的幂函数）。信号检测论是对传统阈限理论的革命——它认为不存在一个固定的阈限，判断是感受性和决策标准的结合。","related":["绝对阈限","差别阈限","极限法","平均差误法","恒定刺激法","韦伯定律","费希纳定律","史蒂文斯幂定律","信号检测论"]},
{"id":176,"cat":"stats","name":"聚类分析","en":"Cluster Analysis","def":"一种无监督的多元统计方法，目的是把相似的个体（或变量）归为同一类，使类内差异最小、类间差异最大。跟LPA（潜在剖面分析）类似，但聚类分析是\"硬分类\"（每个个体只属于一个类），LPA是\"软分类\"（每个个体有属于每个类的概率）。常用方法：层次聚类（系统聚类）和K-means聚类（快速聚类）。","example":"研究\"大学生的学习风格类型\"：收集300名学生在学习动机、学习策略、时间管理等10个变量上的得分，用K-means聚类把学生分成3类——①高投入型（动机高、策略好、时间管理强）；②中等型（各项中等）；③低投入型（各项偏低）。然后比较三类在学业成绩上的差异。层次聚类的思路：先把每个个体各算一类，然后每次把最相似的两类合并，直到所有个体合成一类（树状图/谱系图展示）。K-means的思路：先指定K个类中心，然后迭代分配每个个体到最近的类中心，再重新计算类中心，直到收敛。聚类分析的关键问题：①分几类？（用肘部法则、轮廓系数等判断）；②用什么距离？（欧氏距离最常用）；③结果是否可解释？（不能只看统计指标，要结合理论意义）。","related":["潜在剖面分析","探索性因子分析","中介效应检验"]},
{"id":177,"cat":"construct","name":"神经质","en":"Neuroticism","def":"大五人格（OCEAN）的核心维度之一，指个体情绪的不稳定性和对负性情绪的易感性。高神经质者更容易体验到焦虑、抑郁、愤怒、内疚等负性情绪，情绪波动大，压力应对能力差；低神经质者情绪稳定，冷静，不易焦虑。是预测心理健康问题（抑郁、焦虑、NSSI等）最强的人格变量之一。","example":"神经质与抑郁的相关系数约为r=0.40-0.50，是所有人格变量中与抑郁相关最高的。高神经质者在面对压力事件时更容易产生反刍思维，反刍又进一步加剧抑郁——神经质→反刍→抑郁是经典的中介路径。在方案A（AI情感依赖与心理健康）中，神经质是重要的控制变量——高神经质的人既更可能依赖AI寻求情感支持，也更可能有心理健康问题，如果不控制神经质，AI依赖与抑郁之间的相关可能是神经质的虚假效应。测量：大五人格量表（BFI-2）的神经质维度，或NEO-PI-R的神经质维度（包含焦虑、愤怒敌意、抑郁、自我意识、冲动性、脆弱性6个子维度）。注意：神经质不是\"神经病\"，跟精神疾病没有直接关系，它只是一个正常的人格维度，每个人都有不同程度的神经质。","related":["大五人格","反刍思维","心理韧性","自我控制"]},
{"id":178,"cat":"stats","name":"肯德尔和谐系数","en":"Kendall Coefficient of Concordance (W)","def":"等级相关的一种，用于衡量多个（≥3个）评定者对同一组被试（或事物）评定的一致性程度，也叫肯德尔W系数。取值范围0到1，越接近1表示评定者间一致性越高。跟斯皮尔曼等级相关的区别：斯皮尔曼只适用于两列等级数据，肯德尔W适用于多列等级数据（多个评定者）。312心理统计考点。","example":"3位评委对10名选手的演讲表现排名次，想知道3位评委的评判是否一致。用肯德尔和谐系数：W=0.85，p<0.01，说明3位评委的评定一致性很高。如果W接近0，说明评委们各说各话，评定不可靠。计算公式：W=12S/[k²(n³-n)]，其中k是评定者数，n是被评对象数，S是每个被评对象的等级和Ri与平均等级和的离差平方和（S=Σ(Ri-R̄)²）。当有相同等级（结）时需要校正。显著性检验：当n>7时，用χ²检验，χ²=k(n-1)W，df=n-1。应用场景：①评分者信度（多个评委/编码者的一致性）；②多位专家对多个方案的排序一致性；③问卷中多个题项是否在测同一个维度。跟克朗巴赫α的区别：α用于连续数据的内部一致性，W用于等级/排序数据的评定者一致性。","related":["等级相关","信度","Cronbach's α系数"]},
{"id":179,"cat":"construct","name":"非自杀性自伤","en":"Non-Suicidal Self-Injury (NSSI)","def":"在没有自杀意图的情况下，故意、直接地伤害自己身体组织的行为，如割伤、烧伤、抓伤、撞墙、干扰伤口愈合等。跟自杀行为的关键区别：没有结束生命的意图。常见功能：①情绪调节（用身体疼痛缓解情绪痛苦）；②自我惩罚；③寻求帮助/沟通；④感觉寻求（麻木时感到\"活着\"）。青少年和大学生中发生率较高（约15%-20%终生 prevalence）。","example":"反刍思维与NSSI显著正相关（r=0.30-0.40）——反复回想负面情绪和事件会加剧情绪痛苦，当痛苦无法通过其他方式缓解时，个体可能诉诸自伤来快速缓解情绪。经典中介模型：反刍思维→情绪调节困难→冲动性升高→NSSI。NSSI跟抑郁的关系：NSSI不是抑郁的症状，但两者高度共病——约50%-70%的NSSI者同时有抑郁症状。NSSI是未来自杀企图的重要风险因素（有NSSI史的人自杀企图风险高约3-5倍），但大多数NSSI者不会发展为自杀。常用量表：非自杀性自伤功能评估量表（ISAS）、 Ottawa自伤量表（OSI）。研究方法：横断面问卷调查最常见，纵向研究（追踪NSSI的起始和维持因素）更有价值，经验取样法（ESM）可以实时记录NSSI的触发因素。伦理注意：研究NSSI需要特别的伦理审查，问卷中应包含求助资源信息，访谈中如果发现高风险者需要转介。","related":["反刍思维","冲动性","心理韧性","生态瞬时评估"]},
];

// ===== 本地存储 =====
const STORAGE_KEY = 'psych_glossary_terms_v1';
function loadTerms() {
  try {
    var saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      var parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  } catch(e) { console.warn('加载本地词条失败', e); }
  return JSON.parse(JSON.stringify(DEFAULT_TERMS));
}
function saveTerms() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(terms)); }
  catch(e) { console.warn('保存词条失败', e); }
}
let terms = loadTerms();

// ===== 状态管理 =====
let state = {
  activeCat: 'all',
  searchQuery: '',
  selectedTerm: null,
  manageMode: false,
  editingId: null
};

// ===== DOM 引用 =====
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');
const catList = document.getElementById('catList');
const cardsGrid = document.getElementById('cardsGrid');
const emptyState = document.getElementById('emptyState');
const totalCount = document.getElementById('totalCount');
const visibleCount = document.getElementById('visibleCount');
const randomBtn = document.getElementById('randomBtn');
const resetBtn = document.getElementById('resetBtn');
const modalOverlay = document.getElementById('modalOverlay');
const modalClose = document.getElementById('modalClose');
const modalCatTag = document.getElementById('modalCatTag');
const modalTermName = document.getElementById('modalTermName');
const modalTermEn = document.getElementById('modalTermEn');
const modalBody = document.getElementById('modalBody');
const menuToggle = document.getElementById('menuToggle');
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebarOverlay');

// 管理模式相关
const manageBtn = document.getElementById('manageBtn');
const manageBanner = document.getElementById('manageBanner');
const editModalOverlay = document.getElementById('editModalOverlay');
const editModalClose = document.getElementById('editModalClose');
const editModalTitle = document.getElementById('editModalTitle');
const editModalTermName = document.getElementById('editModalTermName');
const editName = document.getElementById('editName');
const editEn = document.getElementById('editEn');
const editCat = document.getElementById('editCat');
const editDef = document.getElementById('editDef');
const editExample = document.getElementById('editExample');
const editRelated = document.getElementById('editRelated');
const editSaveBtn = document.getElementById('editSaveBtn');
const editCancelBtn = document.getElementById('editCancelBtn');
const editDeleteBtn = document.getElementById('editDeleteBtn');
const dataBtn = document.getElementById('dataBtn');
const dataDropdown = document.getElementById('dataDropdown');
const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const importFile = document.getElementById('importFile');
const resetDataBtn = document.getElementById('resetDataBtn');

// ===== 工具函数 =====
function getCatById(id) {
  return categories.find(c => c.id === id) || categories[0];
}

function highlightText(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const regex = new RegExp(`(${escaped})`, 'gi');
  return text.replace(regex, '<mark>$1</mark>');
}

function getFilteredTerms() {
  let filtered = terms;
  if (state.activeCat !== 'all') {
    filtered = filtered.filter(t => t.cat === state.activeCat);
  }
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    filtered = filtered.filter(t =>
      t.name.toLowerCase().includes(q) ||
      t.en.toLowerCase().includes(q) ||
      t.def.toLowerCase().includes(q) ||
      t.example.toLowerCase().includes(q)
    );
  }
  return filtered;
}

// ===== 渲染分类列表 =====
function renderCatList() {
  catList.innerHTML = '';
  categories.forEach(cat => {
    const count = cat.id === 'all' ? terms.length : terms.filter(t => t.cat === cat.id).length;
    const li = document.createElement('li');
    li.className = 'cat-item' + (state.activeCat === cat.id ? ' active' : '');
    li.innerHTML = `<span>${cat.name}</span><span class="cat-count">${count}</span>`;
    li.addEventListener('click', () => {
      state.activeCat = cat.id;
      renderCatList();
      renderCards();
      closeSidebar();
    });
    catList.appendChild(li);
  });
}

// ===== 渲染词条卡片 =====
function renderCards() {
  const filtered = getFilteredTerms();
  totalCount.textContent = terms.length;
  visibleCount.textContent = filtered.length;

  if (filtered.length === 0) {
    cardsGrid.innerHTML = '';
    emptyState.style.display = 'block';
    return;
  }
  emptyState.style.display = 'none';

  cardsGrid.innerHTML = '';
  filtered.forEach(term => {
    const cat = getCatById(term.cat);
    const card = document.createElement('div');
    card.className = 'term-card';
    card.style.setProperty('--cat-color', cat.color);
    card.style.setProperty('--cat-color-bg', cat.bg);
    card.innerHTML = `
      <span class="term-cat-tag">${cat.name}</span>
      <div class="term-name">${highlightText(term.name, state.searchQuery)}</div>
      <div class="term-name-en">${highlightText(term.en, state.searchQuery)}</div>
      <div class="term-def-short">${highlightText(term.def, state.searchQuery)}</div>
      <div class="card-actions">
        <button class="card-btn edit-btn" data-id="${term.id}">编辑</button>
        <button class="card-btn del" data-id="${term.id}">删除</button>
      </div>
    `;
    card.addEventListener('click', () => openModal(term));
    // 管理模式按钮事件
    var editBtn = card.querySelector('.edit-btn');
    var delBtn = card.querySelector('.del');
    if (editBtn) editBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      var t = terms.find(function(x){ return x.id === term.id; });
      if (t) openEditModal(t);
    });
    if (delBtn) delBtn.addEventListener('click', function(e) {
      e.stopPropagation();
      if (!confirm('确定删除「' + term.name + '」？')) return;
      terms = terms.filter(function(x){ return x.id !== term.id; });
      saveTerms();
      renderCatList();
      renderCards();
    });
    cardsGrid.appendChild(card);
  });

  // 管理模式：新增词条卡片
  if (state.manageMode) {
    var addCard = document.createElement('div');
    addCard.className = 'add-card';
    addCard.innerHTML = '<span class="add-card-icon">+</span>新增词条';
    addCard.addEventListener('click', function() { openEditModal(null); });
    cardsGrid.appendChild(addCard);
  }
}

// ===== 模态框 =====
function openModal(term) {
  const cat = getCatById(term.cat);
  state.selectedTerm = term;

  modalCatTag.textContent = cat.name;
  modalCatTag.style.background = cat.bg;
  modalCatTag.style.color = cat.color;
  modalTermName.textContent = term.name;
  modalTermEn.textContent = term.en;

  let relatedHtml = '';
  if (term.related && term.related.length > 0) {
    const relatedTerms = term.related.map(rName => {
      const found = terms.find(t => t.name === rName);
      return found ? found : null;
    }).filter(Boolean);
    if (relatedTerms.length > 0) {
      relatedHtml = `
        <div class="modal-section">
          <div class="modal-section-title">相关术语</div>
          <div class="related-terms">
            ${relatedTerms.map(rt => `<span class="related-tag" data-id="${rt.id}">${rt.name}</span>`).join('')}
          </div>
        </div>
      `;
    }
  }

  modalBody.innerHTML = `
    <div class="modal-section">
      <div class="modal-section-title">定义</div>
      <div class="modal-section-content">${term.def}</div>
    </div>
    <div class="modal-section">
      <div class="modal-section-title">示例 / 用法</div>
      <div class="modal-section-content example-box">${term.example}</div>
    </div>
    ${relatedHtml}
  `;

  // 相关术语点击
  modalBody.querySelectorAll('.related-tag').forEach(tag => {
    tag.addEventListener('click', () => {
      const id = parseInt(tag.dataset.id);
      const rt = terms.find(t => t.id === id);
      if (rt) openModal(rt);
    });
  });

  modalOverlay.classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  modalOverlay.classList.remove('visible');
  document.body.style.overflow = '';
  state.selectedTerm = null;
}

// ===== 侧边栏（移动端） =====
function openSidebar() {
  sidebar.classList.add('open');
  sidebarOverlay.classList.add('visible');
}
function closeSidebar() {
  sidebar.classList.remove('open');
  sidebarOverlay.classList.remove('visible');
}

// ===== 事件绑定 =====
searchInput.addEventListener('input', (e) => {
  state.searchQuery = e.target.value.trim();
  searchClear.classList.toggle('visible', state.searchQuery.length > 0);
  renderCards();
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  state.searchQuery = '';
  searchClear.classList.remove('visible');
  renderCards();
  searchInput.focus();
});

randomBtn.addEventListener('click', () => {
  const filtered = getFilteredTerms();
  if (filtered.length > 0) {
    const randomTerm = filtered[Math.floor(Math.random() * filtered.length)];
    openModal(randomTerm);
  }
});

resetBtn.addEventListener('click', () => {
  state.activeCat = 'all';
  state.searchQuery = '';
  searchInput.value = '';
  searchClear.classList.remove('visible');
  renderCatList();
  renderCards();
});

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (editModalOverlay.classList.contains('visible')) closeEditModal();
    else if (modalOverlay.classList.contains('visible')) closeModal();
    else if (sidebar.classList.contains('open')) closeSidebar();
  }
});

menuToggle.addEventListener('click', openSidebar);
sidebarOverlay.addEventListener('click', closeSidebar);

// ===== 管理模式 =====
function toggleManageMode() {
  state.manageMode = !state.manageMode;
  manageBtn.classList.toggle('active', state.manageMode);
  manageBanner.classList.toggle('visible', state.manageMode);
  document.body.classList.toggle('manage-mode', state.manageMode);
  renderCards();
}

function getNextId() {
  var maxId = 0;
  terms.forEach(function(t) { if (t.id > maxId) maxId = t.id; });
  return maxId + 1;
}

function populateCatSelect() {
  editCat.innerHTML = '';
  categories.forEach(function(c) {
    if (c.id === 'all') return;
    var opt = document.createElement('option');
    opt.value = c.id;
    opt.textContent = c.name;
    editCat.appendChild(opt);
  });
}

function openEditModal(term) {
  populateCatSelect();
  if (term) {
    state.editingId = term.id;
    editModalTitle.textContent = '编辑词条';
    editModalTermName.textContent = term.name;
    editName.value = term.name || '';
    editEn.value = term.en || '';
    editCat.value = term.cat || 'basic';
    editDef.value = term.def || '';
    editExample.value = term.example || '';
    editRelated.value = (term.related || []).join('，');
    editDeleteBtn.style.display = 'block';
  } else {
    state.editingId = null;
    editModalTitle.textContent = '新增词条';
    editModalTermName.textContent = '';
    editName.value = '';
    editEn.value = '';
    editCat.value = 'basic';
    editDef.value = '';
    editExample.value = '';
    editRelated.value = '';
    editDeleteBtn.style.display = 'none';
  }
  editModalOverlay.classList.add('visible');
  document.body.style.overflow = 'hidden';
}

function closeEditModal() {
  editModalOverlay.classList.remove('visible');
  document.body.style.overflow = '';
  state.editingId = null;
}

function saveTerm() {
  var name = editName.value.trim();
  var def = editDef.value.trim();
  var cat = editCat.value;
  if (!name) { alert('请填写词条名称'); editName.focus(); return; }
  if (!def) { alert('请填写定义'); editDef.focus(); return; }
  var relatedStr = editRelated.value.trim();
  var related = relatedStr ? relatedStr.split(/[，,]/).map(function(s){return s.trim();}).filter(Boolean) : [];
  var termData = {
    name: name,
    en: editEn.value.trim(),
    cat: cat,
    def: def,
    example: editExample.value.trim(),
    related: related
  };
  if (state.editingId) {
    var idx = terms.findIndex(function(t){ return t.id === state.editingId; });
    if (idx !== -1) {
      termData.id = state.editingId;
      terms[idx] = termData;
    }
  } else {
    termData.id = getNextId();
    terms.push(termData);
  }
  saveTerms();
  renderCatList();
  renderCards();
  closeEditModal();
}

function deleteTerm() {
  if (!state.editingId) return;
  if (!confirm('确定要删除这个词条吗？此操作不可撤销。')) return;
  terms = terms.filter(function(t){ return t.id !== state.editingId; });
  saveTerms();
  renderCatList();
  renderCards();
  closeEditModal();
}

// ===== 导入导出 =====
function exportTerms() {
  var data = JSON.stringify(terms, null, 2);
  var blob = new Blob([data], {type: 'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = '心理学黑话词典词条_' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importTerms(file) {
  var reader = new FileReader();
  reader.onload = function(e) {
    try {
      var data = JSON.parse(e.target.result);
      if (!Array.isArray(data)) throw new Error('格式错误');
      var valid = data.filter(function(t) { return t.name && t.def; });
      if (valid.length === 0) { alert('文件中没有有效的词条'); return; }
      if (!confirm('将导入 ' + valid.length + ' 个词条，是否合并到现有词条中？\n点击"确定"合并，"取消"覆盖全部现有词条。')) {
        terms = valid;
      } else {
        valid.forEach(function(t) {
          if (!t.id) t.id = getNextId();
          var existing = terms.findIndex(function(x){ return x.id === t.id; });
          if (existing !== -1) terms[existing] = t;
          else terms.push(t);
        });
      }
      saveTerms();
      renderCatList();
      renderCards();
      alert('导入成功，当前共 ' + terms.length + ' 个词条');
    } catch(err) {
      alert('导入失败：' + err.message);
    }
  };
  reader.readAsText(file, 'utf-8');
}

function resetToDefault() {
  if (!confirm('确定要恢复默认词条吗？你所有的新增和修改都会丢失！')) return;
  localStorage.removeItem(STORAGE_KEY);
  terms = JSON.parse(JSON.stringify(DEFAULT_TERMS));
  renderCatList();
  renderCards();
  alert('已恢复默认词条（' + terms.length + '个）');
}

// ===== 事件绑定（管理模式） =====
manageBtn.addEventListener('click', toggleManageMode);
editModalClose.addEventListener('click', closeEditModal);
editCancelBtn.addEventListener('click', closeEditModal);
editSaveBtn.addEventListener('click', saveTerm);
editDeleteBtn.addEventListener('click', deleteTerm);
editModalOverlay.addEventListener('click', function(e) {
  if (e.target === editModalOverlay) closeEditModal();
});
exportBtn.addEventListener('click', function() { dataDropdown.classList.remove('visible'); exportTerms(); });
importBtn.addEventListener('click', function() { dataDropdown.classList.remove('visible'); importFile.click(); });
importFile.addEventListener('change', function(e) { if (e.target.files[0]) importTerms(e.target.files[0]); e.target.value = ''; });
resetDataBtn.addEventListener('click', function() { dataDropdown.classList.remove('visible'); resetToDefault(); });
dataBtn.addEventListener('click', function(e) {
  e.stopPropagation();
  dataDropdown.classList.toggle('visible');
});
document.addEventListener('click', function() { dataDropdown.classList.remove('visible'); });

// ===== 初始化 =====
renderCatList();
renderCards();
</script>
