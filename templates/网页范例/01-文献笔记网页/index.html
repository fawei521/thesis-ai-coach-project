{"id":131,"star":true,"cat":"nssi","title":"青少年抑郁症非自杀性自伤行为相关因素及其作用路径的研究","source":"硕士论文","year":"2026","type":"横断面·路径分析","tags":["NSSI","抑郁症","相关因素","路径分析","青少年"],
"abstract":"本研究探讨了青少年抑郁症非自杀性自伤（NSSI）行为的相关因素及其作用路径。结果发现：（1）孤独感、反刍思维、抑郁、焦虑等变量显著预测NSSI；（2）路径分析显示孤独感通过反刍思维影响NSSI；（3）家庭因素、学校因素和个体因素共同影响NSSI。研究结论认为，减少孤独感和反刍思维可以预防青少年抑郁症患者的NSSI。",
"insight":"这篇论文直接发现\"孤独感→反刍思维→NSSI\"的路径，跟本研究的链式中介模型后半段完全一致！\n这是本研究模型的又一个直接验证——孤独感→反刍思维→NSSI的路径在青少年抑郁样本中被验证\n样本是青少年抑郁症患者，跟本研究拟扩展的群体相关\n2026年最新研究，硕士论文","cnkiUrl":"https://kns.cnki.net/kns8s/defaultresult/index?kw=青少年抑郁症非自杀性自伤行为相关因素及其作用路径的研究"},
{"id":132,"cat":"nssi","title":"家庭累积风险与初中生非自杀性自伤的关系及心理健康素养干预","source":"硕士论文","year":"2025","type":"横断面·相关+干预","tags":["NSSI","家庭累积风险","心理健康素养","干预","初中生"],
"abstract":"本研究探讨了家庭累积风险与初中生非自杀性自伤（NSSI）的关系，并设计了心理健康素养干预方案。结果发现：（1）家庭累积风险显著正向预测NSSI；（2）孤独感、反刍思维、抑郁等变量在家庭累积风险与NSSI之间起中介作用；（3）心理健康素养干预可以有效降低NSSI。",

{"id":134,"cat":"ai","star":true,"title":"I-PACE模型下青少年生成式人工智能依赖影响因素分析","source":"连云港师范学院学报","year":"2026","type":"理论分析","tags":["生成式AI","青少年","AI依赖","I-PACE模型","影响因素"],"abstract":"本文基于I-PACE（Interaction of Person-Affect-Cognition-Execution）模型，系统分析了青少年生成式人工智能依赖的影响因素。研究从三个维度构建形成机制模型：（1）个体易感因素，包括人格特质（如神经质、外向性）、心理健康状况（如抑郁、焦虑）和人口学特征；（2）情感与认知因素，包括孤独感、社交焦虑、认知负荷、AI心智感知；（3）执行功能因素，包括冲动控制、自我调节能力、延迟满足能力。文章指出，青少年正处于自我同一性形成和情绪调节能力发展的关键期，对AI提供的即时情感回应和无条件积极关注缺乏足够的批判性认知，更容易形成依赖。研究还讨论了家庭教养方式、学校教育和社会环境在AI依赖形成中的调节作用，并从家庭、学校、平台、政府四个层面提出了预防和干预建议。","insight":"这是知网中为数不多直接研究'青少年生成式AI依赖'的期刊论文，用I-PACE模型系统分析了影响因素，为本研究的自变量提供了国内理论支撑\nI-PACE模型原本用于解释网络成瘾和行为成瘾，本研究将其推广到AI依赖，说明AI依赖被学界视为一种新型行为成瘾\n文章提到'孤独感、社交焦虑'是AI依赖的重要前因，与本研究'AI依赖→孤独感'的路径方向相反，提示可能存在双向循环关系，讨论部分可以提及\n文章强调青少年'自我同一性形成关键期'这一发展特征（埃里克森理论），可以在引言中用来说明为什么选择青少年作为研究对象\n'家庭、学校、平台、政府'四层建议框架，可以借鉴到本研究的实践意义部分","cnkiUrl":"https://kns.cnki.net/kns8s/defaultresult/index?kw=I-PACE模型下青少年生成式人工智能依赖影响因素分析"},
{"id":135,"cat":"ai","star":true,"title":"生成式人工智能如何影响青少年心理健康","source":"学术前沿","year":"2026","type":"理论探讨","tags":["生成式AI","青少年","心理健康","情感陪伴","风险"],"abstract":"本文探讨了生成式人工智能对青少年心理健康的双重影响。积极方面：AI可以提供情感陪伴、心理支持和学习辅助，对缓解孤独感和焦虑有一定积极作用，特别是对于社交回避或现实社交困难的青少年，AI提供了低压力的情感表达渠道。消极方面：过度依赖AI可能导致现实社交能力退化、批判性思维减弱、情感调节能力受损。文章特别关注了AI情感陪伴产品对青少年的影响，指出AI提供的'完美情感回应'——永远不会评判、不会拒绝、不会生气、随时在线——可能让青少年逃避现实人际关系中的冲突和挫折，形成情感依赖和社交回避。研究还讨论了AI生成内容的真实性问题对青少年认知发展的影响，以及算法推荐可能造成的信息茧房效应。最后，文章从家庭、学校、平台和政府四个层面提出了引导青少年健康使用AI的建议。","insight":"这篇文章直接讨论了'生成式AI对青少年心理健康的影响'，是本研究引言部分的重要参考文献\n文章提出的'完美情感回应→逃避现实社交→情感依赖'逻辑链，直接支持本研究的社会补偿假说\n文章同时呈现了AI的积极和消极影响，提醒我们在讨论部分要客观全面，不能只说负面影响\n'家庭、学校、平台、政府'四层建议框架，可以借鉴到本研究的实践意义部分\n发表在《学术前沿》，是面向决策者的高端智库期刊，说明该话题已受到政策层面关注","cnkiUrl":"https://kns.cnki.net/kns8s/defaultresult/index?kw=生成式人工智能如何影响青少年心理健康"},
{"id":136,"cat":"ai","star":true,"title":"对话式人工智能对青少年主动健康行为影响的研究进展","source":"中国学校卫生","year":"2026","type":"综述","tags":["对话式AI","青少年","健康行为","情感支持","研究进展"],"abstract":"本文系统综述了对话式人工智能（Conversational AI, CAI）对青少年主动健康行为的影响。研究发现，CAI在青少年健康教育、心理健康支持和行为干预中展现出应用潜力：可以提供个性化的健康信息、24小时情感支持和行为提醒，对于那些不愿寻求专业心理咨询的青少年尤其有价值。然而，CAI的使用也存在潜在风险，包括信息准确性不足、隐私泄露、过度依赖和情感依恋等问题。文章特别指出，当前研究多集中在CAI的应用效果评估，对其长期影响和作用机制的研究还很缺乏。特别是CAI对青少年社会情感发展和人际关系的影响，需要更多实证研究。文章建议未来研究应关注CAI使用与青少年心理健康之间的因果关系，并开展长期追踪研究，同时建立CAI在青少年健康领域应用的伦理规范和监管框架。","insight":"发表在《中国学校卫生》（北大核心+CSCD），下载量526，说明这篇文章受到较多关注\n文章明确指出'CAI对青少年社会情感发展和人际关系的影响需要更多实证研究'——本研究正好填补这个空白\n文章提到'过度依赖和情感依恋'是CAI的潜在风险，直接支持本研究的自变量合理性\n综述类文章可以在引言中引用，用来说明该领域的研究现状和不足\n文章建议'建立CAI在青少年健康领域应用的伦理规范'，与2026年7月施行的《人工智能拟人化互动服务管理暂行办法》呼应","cnkiUrl":"https://kns.cnki.net/kns8s/defaultresult/index?kw=对话式人工智能对青少年主动健康行为影响的研究进展"},
{"id":137,"cat":"ai","title":"依赖AI让青少年疏于真实人际交往","source":"中国科学报","year":"2026","type":"报纸评论","tags":["AI依赖","青少年","人际交往","社会替代"],"abstract":"本文报道了青少年过度依赖AI导致真实人际交往能力退化的现象。文章引用多项调查数据指出，越来越多的青少年在遇到情感困扰时选择向AI倾诉而非向家人朋友求助，导致现实社交技能退化、人际沟通能力下降、社交意愿降低。专家指出，AI提供的'无条件积极关注'虽然令人舒适，但无法替代真实人际关系中的情感联结和成长体验——真实关系中的冲突、拒绝、和解都是青少年社会情感发展的必要环节。长期依赖AI情感陪伴可能让青少年逃避现实社交中的不适，形成社交回避，进而加剧孤独感和社交焦虑，形成'孤独→依赖AI→更孤独'的恶性循环。文章呼吁学校和家长关注青少年的AI使用方式，引导其建立健康的人机关系，鼓励现实人际互动。","insight":"中国科学报的评论文章，虽然不是实证研究，但观点权威，可以在引言中引用来说明现实问题\n'AI倾诉→现实社交退化→孤独感加剧'的逻辑链，直接支持本研究'AI情感依赖→孤独感'的路径假设\n文章提到'社交回避'这一中介机制，可以在讨论部分展开\n'孤独→依赖AI→更孤独'的恶性循环表述，跟本研究的模型方向相反但变量重叠，说明可能存在双向因果\n报纸类文献在本科论文中可以少量引用作为现实背景，但不能作为核心理论依据","cnkiUrl":"https://kns.cnki.net/kns8s/defaultresult/index?kw=依赖AI让青少年疏于真实人际交往"},
{"id":138,"cat":"ai","title":"部分青少年过度依赖AI值得关注","source":"经济参考报","year":"2026","type":"报纸评论","tags":["AI依赖","青少年","过度使用","监管"],"abstract":"本文关注青少年过度依赖AI的现象，指出部分青少年在学习、生活和情感方面过度依赖AI工具，出现了独立思考能力下降、情感表达能力退化、现实社交意愿降低等问题。文章引用了多地教育部门的调研数据，说明AI依赖在青少年中已不是个别现象，而是需要引起重视的普遍性问题。专家分析认为，AI的情感化设计（拟人化语气、共情表达、即时回应）是导致青少年情感依赖的重要原因——青少年正处于情感需求旺盛的阶段，AI提供的'永远在线、永远耐心、永远积极'的情感回应恰好满足了这一需求。文章特别指出，AI情感陪伴产品对青少年的影响尤其值得关注，需要相关部门出台针对性的监管措施。专家建议，应加强对青少年AI使用的引导和监管，建立AI使用时长提醒和内容审核机制，同时加强青少年的数字素养教育和心理健康教育。","insight":"经济参考报的评论文章，可以作为现实背景引用\n文章提到'AI情感陪伴产品对青少年的影响尤其值得关注'，与本研究主题直接相关\n可以与2026年7月施行的《人工智能拟人化互动服务管理暂行办法》结合引用，说明政策和媒体都在关注这个问题\n'AI的情感化设计是导致情感依赖的重要原因'这一分析，可以在引言中用来解释AI情感依赖的形成机制\n报纸类文献适合放在引言的现实背景部分","cnkiUrl":"https://kns.cnki.net/kns8s/defaultresult/index?kw=部分青少年过度依赖AI值得关注"},
{"id":139,"cat":"ai","title":"青少年人工智能依赖如何破解","source":"群言","year":"2026","type":"期刊评论","tags":["AI依赖","青少年","破解路径","数字素养"],"abstract":"本文分析了青少年人工智能依赖的成因和破解路径。文章指出，青少年AI依赖的形成是多因素共同作用的结果：（1）技术层面——AI的情感化设计、即时反馈机制、个性化推荐让用户容易沉浸其中；（2）个体层面——孤独感、社交焦虑、自我认同困惑、情绪调节能力不足使青少年更倾向于向AI寻求情感支持；（3）家庭层面——亲子沟通不足、家庭情感支持缺失使青少年转向AI寻求陪伴；（4）学校层面——数字素养教育不足、心理健康教育缺位。文章提出，破解青少年AI依赖需要多方合力：家长应加强陪伴和沟通，建立良好的亲子关系；学校应开展数字素养教育，引导学生正确认识和使用AI；平台应完善青少年模式和防沉迷机制；政府应加强监管，完善相关法律法规。文章特别强调，不能简单地'禁用'AI，而应引导青少年建立健康的使用习惯，发挥AI的积极作用，同时避免过度情感依赖。","insight":"群言期刊的评论文章，分析了AI依赖的多层面成因\n文章提到'孤独感、社交焦虑'是AI依赖的个体层面原因，与本研究的模型相关\n'不能简单禁用，要引导健康使用'的观点，可以写进本研究的实践意义部分\n文章的多层面成因分析框架（技术、个体、家庭、学校），可以借鉴到讨论部分\n'自我认同困惑'是青少年的发展特征（埃里克森自我同一性理论），可以在引言中引用","cnkiUrl":"https://kns.cnki.net/kns8s/defaultresult/index?kw=青少年人工智能依赖如何破解"},
{"id":140,"cat":"ai","title":"人机交互语境中青少年自我同一性问题研究","source":"淮南职业技术学院学报","year":"2026","type":"理论探讨","tags":["人机交互","青少年","自我同一性","发展心理"],"abstract":"本文从发展心理学角度探讨了人机交互语境中青少年自我同一性的形成问题。研究指出，青少年正处于埃里克森提出的自我同一性形成的关键期（12-18岁），其核心任务是探索'我是谁'的问题。而AI聊天机器人的情感化和拟人化设计可能对青少年的自我认知和身份认同产生复杂影响。一方面，AI可以提供安全的自我探索空间——青少年可以在与AI的对话中表达和理解自己的情感，尝试不同的自我表达，而不用担心被评判或拒绝；另一方面，过度依赖AI的情感回应可能让青少年回避真实的人际反馈，而真实的人际反馈（包括冲突和拒绝）是自我同一性形成的必要条件。文章还讨论了AI'完美人设'对青少年自我期望的影响，以及人机关系中边界模糊带来的认同困惑——青少年可能难以区分'AI的回应是程序还是真实情感'，进而影响其对人际关系的认知。","insight":"这篇文章从自我同一性角度探讨AI对青少年的影响，理论视角独特\n'自我同一性形成关键期'是发展心理学的经典概念（埃里克森），可以在引言中用来说明青少年的发展特征\n文章提到'AI提供安全的自我探索空间'，这是AI的积极作用，可以在讨论部分客观呈现\n'人机关系边界模糊'这一概念，与AI情感依赖的形成机制相关——青少年可能把AI的程序化回应误认为真实情感\n发表在淮南职业技术学院学报，普通期刊，但理论视角有参考价值","cnkiUrl":"https://kns.cnki.net/kns8s/defaultresult/index?kw=人机交互语境中青少年自我同一性问题研究"}

const catNames = {ai:'AI与心理健康', nssi:'反刍思维与NSSI', theory:'理论与量表'};
const catColors = {ai:'var(--orange)', nssi:'var(--green2)', theory:'#7C3AED'};
const STORAGE_KEY = 'literature_notes_papers_v7';
let currentCat = 'all';
let searchTerm = '';
let starOnly = false;
let papers = loadPapers();
let editingId = null;

function loadPapers() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const parsed = JSON.parse(saved);
      if (Array.isArray(parsed) && parsed.length > 0) return parsed;
    }
  } catch(e) {}
  return JSON.parse(JSON.stringify(DEFAULT_PAPERS));
}

function savePapers() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(papers));
  } catch(e) {}
}

function render() {
  const grid = document.getElementById('grid');
  const filtered = papers.filter(p => {
    const matchCat = currentCat === 'all' || p.cat === currentCat;
    const matchStar = !starOnly || p.star;
    const matchSearch = !searchTerm || 
      p.title.toLowerCase().includes(searchTerm) ||
      p.abstract.toLowerCase().includes(searchTerm) ||
      p.insight.toLowerCase().includes(searchTerm) ||
      p.tags.some(t => t.toLowerCase().includes(searchTerm)) ||
      p.source.toLowerCase().includes(searchTerm);
    return matchCat && matchStar && matchSearch;
  });
  document.getElementById('stats').textContent = `共 ${filtered.length} 篇文献`;
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">没有找到匹配的文献<br>换个关键词试试</div>';
    return;
  }
  grid.innerHTML = filtered.map(p => `
    <div class="card" onclick="showModal(${p.id})" style="${p.star ? 'border-color:gold;box-shadow:0 2px 12px rgba(255,215,0,0.15)' : ''}">
      <div class="card-cat cat-${p.cat}">${catNames[p.cat]}</div>
      <div class="card-title">${p.star ? '⭐ ' : ''}${p.title}${p.cnkiUrl ? ' <a href="'+p.cnkiUrl+'" target="_blank" onclick="event.stopPropagation()" style="color:var(--orange);font-size:12px;text-decoration:none;vertical-align:middle" title="在知网中搜索">&#128279;</a>' : ''}</div>
      <div class="card-meta">
        <span>${p.source}</span>
        <span>${p.year}</span>
        <span>${p.type}</span>
      </div>
      <div class="card-tags">${p.tags.slice(0,3).map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
  `).join('');
}

function showModal(id) {
  const p = papers.find(x => x.id === id);
  if (!p) return;
  const insightItems = p.insight.split('\n').filter(s => s.trim());
  document.getElementById('modalContent').innerHTML = `
    <div class="modal-cat" style="background:${catColors[p.cat]}">${catNames[p.cat]}</div>
    <div class="modal-title">${p.star ? '⭐ 重点文献 · ' : ''}${p.title}</div>
    <div class="modal-meta">
      <span><strong>来源：</strong>${p.source}</span>
      <span><strong>年份：</strong>${p.year}</span>
      <span><strong>类型：</strong>${p.type}</span>
    </div>
    <div class="modal-section">
      <h3>摘要</h3>
      <p>${p.abstract}</p>
    </div>
    <div class="modal-section">
      <h3>启发与观点</h3>
      <ul>${insightItems.map(item => `<li>${item}</li>`).join('')}</ul>
    </div>
    <div class="modal-section">
      <h3>关键词</h3>
      <div class="modal-tags">${p.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
    </div>
    <div class="modal-actions">
      ${p.cnkiUrl ? `<a href="${p.cnkiUrl}" target="_blank"><button class="btn btn-edit" style="background:var(--orange)">在知网查看</button></a>` : ''}
      <button class="btn btn-edit" onclick="openEdit(${p.id})">编辑这篇</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function openEdit(id) {
  const p = papers.find(x => x.id === id);
  if (!p) return;
  editingId = id;
  document.getElementById('editTitle').value = p.title;
  document.getElementById('editSource').value = p.source;
  document.getElementById('editYear').value = p.year;
  document.getElementById('editType').value = p.type;
  document.getElementById('editTags').value = p.tags.join(', ');
  document.getElementById('editAbstract').value = p.abstract;
  document.getElementById('editInsight').value = p.insight;
  document.getElementById('editOverlay').classList.add('show');
}

function closeEdit() {
  document.getElementById('editOverlay').classList.remove('show');
  editingId = null;
}

document.getElementById('editSave').onclick = function() {
  if (editingId === null) return;
  const idx = papers.findIndex(x => x.id === editingId);
  if (idx === -1) return;
  papers[idx].title = document.getElementById('editTitle').value.trim();
  papers[idx].source = document.getElementById('editSource').value.trim();
  papers[idx].year = document.getElementById('editYear').value.trim();
  papers[idx].type = document.getElementById('editType').value.trim();
  papers[idx].tags = document.getElementById('editTags').value.split(',').map(s => s.trim()).filter(s => s);
  papers[idx].abstract = document.getElementById('editAbstract').value.trim();
  papers[idx].insight = document.getElementById('editInsight').value.trim();
  savePapers();
  closeEdit();
  render();
  showModal(editingId);
};

document.getElementById('editCancel').onclick = closeEdit;
document.getElementById('editOverlay').onclick = function(e) {
  if (e.target === this) closeEdit();
};

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('modalOverlay').onclick = function(e) {
  if (e.target === this) closeModal();
};
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.body.style.overflow = '';
}

document.getElementById('filters').addEventListener('click', function(e) {
  if (e.target.classList.contains('filter-btn')) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    currentCat = e.target.dataset.cat;
    render();
  }
});

document.getElementById('starFilter').addEventListener('click', function() {
  starOnly = !starOnly;
  this.classList.toggle('active', starOnly);
  this.style.background = starOnly ? 'gold' : '';
  this.style.color = starOnly ? '#333' : 'gold';
  render();
});

document.getElementById('searchInput').addEventListener('input', function(e) {
  searchTerm = e.target.value.toLowerCase().trim();
  render();
});

document.getElementById('randomBtn').onclick = function() {
  const filtered = papers.filter(p => currentCat === 'all' || p.cat === currentCat);
  const random = filtered[Math.floor(Math.random() * filtered.length)];
  showModal(random.id);
};

document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') {
    if (document.getElementById('editOverlay').classList.contains('show')) {
      closeEdit();
    } else {
      closeModal();
    }
  }
});

render();
</script>
</body>
</html>
